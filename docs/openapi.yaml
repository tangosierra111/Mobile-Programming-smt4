openapi: 3.1.0
info:
  title: Mobile Programming API
  version: 1.0.0
  description: Kontrak REST API antara Laravel dan aplikasi Flutter.
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Laravel lokal untuk Web dan Windows
  - url: http://10.0.2.2:8000/api/v1
    description: Laravel lokal dari Android emulator
security:
  - FirebaseBearer: []
tags:
  - name: Authentication
  - name: Courses
  - name: Meetings
  - name: Profile
  - name: Exams

paths:
  /auth/sync:
    post:
      tags: [Authentication]
      summary: Sinkronkan Firebase user dengan database Laravel
      operationId: syncFirebaseUser
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSyncRequest'
      responses:
        '200':
          description: User sudah tersedia dan diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSyncResponse'
        '201':
          description: User Laravel baru berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSyncResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /courses:
    get:
      tags: [Courses]
      summary: Ambil seluruh mata kuliah aktif
      operationId: listCourses
      responses:
        '200':
          description: Daftar mata kuliah
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'
                  meta:
                    type: [object, "null"]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /courses/{courseId}/dashboard:
    get:
      tags: [Courses]
      summary: Ambil dashboard mata kuliah beserta progres user
      operationId: getCourseDashboard
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Dashboard berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings/{meetingId}:
    get:
      tags: [Meetings]
      summary: Ambil detail materi dan content blocks
      operationId: getMeeting
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: Detail materi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings/{meetingId}/progress:
    put:
      tags: [Meetings]
      summary: Buat atau perbarui progres materi user aktif
      operationId: updateMeetingProgress
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdateRequest'
      responses:
        '200':
          description: Progres diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /profile:
    get:
      tags: [Profile]
      summary: Ambil profil user aktif
      operationId: getProfile
      responses:
        '200':
          description: Profil user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Profile]
      summary: Perbarui profil user aktif
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /profile/photo:
    post:
      tags: [Profile]
      summary: Upload foto profil user aktif
      operationId: uploadProfilePhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Foto profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /exams/{examId}:
    get:
      tags: [Exams]
      summary: Ambil detail ujian beserta soal
      operationId: getExam
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Detail ujian
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /exams/{examId}/attempts:
    post:
      tags: [Exams]
      summary: Mulai percobaan ujian untuk user aktif
      operationId: startExamAttempt
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '201':
          description: Percobaan ujian dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Percobaan aktif sudah tersedia atau ujian telah ditutup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /attempts/{attemptId}/answers/{questionId}:
    put:
      tags: [Exams]
      summary: Simpan jawaban pada percobaan aktif
      operationId: saveExamAnswer
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerUpdateRequest'
      responses:
        '200':
          description: Jawaban tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /attempts/{attemptId}/submit:
    post:
      tags: [Exams]
      summary: Submit percobaan ujian
      operationId: submitExamAttempt
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Ujian berhasil dikirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Percobaan sudah pernah dikirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase-ID-Token

  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ExamId:
      name: examId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    Unauthorized:
      description: Firebase ID token tidak ada, kedaluwarsa, atau tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: User tidak memiliki akses terhadap resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request gagal divalidasi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    AuthSyncRequest:
      type: object
      properties:
        display_name:
          type: [string, "null"]
          maxLength: 150
        photo_url:
          type: [string, "null"]
          format: uri

    AuthSyncResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserSession'
        meta:
          type: [object, "null"]

    UserSession:
      type: object
      required: [user, profile]
      properties:
        user:
          $ref: '#/components/schemas/User'
        profile:
          $ref: '#/components/schemas/Profile'

    User:
      type: object
      required: [id, firebase_uid, name, email, role, is_active]
      properties:
        id:
          type: integer
        firebase_uid:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        email_verified_at:
          type: [string, "null"]
          format: date-time
        role:
          type: string
          enum: [student, lecturer, admin]
        is_active:
          type: boolean

    Course:
      type: object
      required:
        - id
        - code
        - name
        - study_program
        - faculty
        - lecturer_name
        - is_active
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        study_program:
          type: string
        faculty:
          type: string
        lecturer_name:
          type: string
        description:
          type: [string, "null"]
        is_active:
          type: boolean

    DashboardResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: object
          required: [course, items, progress_summary]
          properties:
            course:
              $ref: '#/components/schemas/Course'
            items:
              type: array
              items:
                $ref: '#/components/schemas/LearningItem'
            progress_summary:
              $ref: '#/components/schemas/ProgressSummary'
        meta:
          type: [object, "null"]

    LearningItem:
      type: object
      required:
        - id
        - source_id
        - type
        - route_key
        - title
        - accent_color
        - background_color
        - status
        - sort_order
        - keywords
      properties:
        id:
          type: string
          pattern: '^(meeting|exam)-[0-9]+$'
        source_id:
          type: integer
        type:
          type: string
          enum: [meeting, exam]
        route_key:
          type: string
        meeting_number:
          type: [integer, "null"]
        exam_type:
          type: [string, "null"]
          enum: [uts, uas, quiz, null]
        slug:
          type: [string, "null"]
        title:
          type: string
        accent_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        background_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        status:
          type: string
          enum: [draft, published, archived, closed]
        interactive_demo_key:
          type: [string, "null"]
        sort_order:
          type: integer
        keywords:
          type: array
          items:
            type: string
        progress:
          oneOf:
            - $ref: '#/components/schemas/Progress'
            - type: "null"

    ProgressSummary:
      type: object
      required: [published_meetings, completed_meetings, progress_percent]
      properties:
        published_meetings:
          type: integer
        completed_meetings:
          type: integer
        progress_percent:
          type: number
          minimum: 0
          maximum: 100

    MeetingResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Meeting'
        meta:
          type: [object, "null"]

    Meeting:
      type: object
      required:
        - id
        - course_id
        - meeting_number
        - slug
        - title
        - accent_color
        - background_color
        - status
        - sort_order
        - keywords
        - content_blocks
      properties:
        id:
          type: integer
        course_id:
          type: integer
        meeting_number:
          type: integer
        slug:
          type: string
        title:
          type: string
        summary:
          type: [string, "null"]
        accent_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        background_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        status:
          type: string
          enum: [draft, published, archived]
        available_at:
          type: [string, "null"]
          format: date-time
        interactive_demo_key:
          type: [string, "null"]
        sort_order:
          type: integer
        keywords:
          type: array
          items:
            type: string
        content_blocks:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'

    ContentBlock:
      type: object
      required:
        - id
        - meeting_id
        - block_key
        - block_type
        - content_json
        - sort_order
        - is_visible
      properties:
        id:
          type: integer
        meeting_id:
          type: integer
        block_key:
          type: string
        block_type:
          type: string
          enum:
            - heading
            - paragraph
            - bullet_list
            - code
            - key_value
            - callout
            - image
            - demo
        title:
          type: [string, "null"]
        content_json:
          type: object
          additionalProperties: true
        sort_order:
          type: integer
        is_visible:
          type: boolean

    ProgressUpdateRequest:
      type: object
      required: [status, progress_percent]
      properties:
        status:
          type: string
          enum: [not_started, in_progress, completed]
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100

    ProgressResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Progress'
        meta:
          type: [object, "null"]

    Progress:
      type: object
      required: [id, user_id, meeting_id, status, progress_percent]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        meeting_id:
          type: integer
        status:
          type: string
          enum: [not_started, in_progress, completed]
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        last_opened_at:
          type: [string, "null"]
          format: date-time

    ProfileResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Profile'
        meta:
          type: [object, "null"]

    Profile:
      type: object
      required:
        - user_id
        - full_name
        - email
        - projects_count
        - followers_count
        - experience_years
      properties:
        user_id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        location:
          type: [string, "null"]
        position:
          type: [string, "null"]
        profession:
          type: [string, "null"]
        phone_number:
          type: [string, "null"]
        about:
          type: [string, "null"]
        photo_url:
          type: [string, "null"]
          format: uri
        projects_count:
          type: integer
          minimum: 0
        followers_count:
          type: integer
          minimum: 0
        experience_years:
          type: integer
          minimum: 0
        linkedin_url:
          type: [string, "null"]
          format: uri

    ProfileUpdateRequest:
      type: object
      required: [full_name]
      properties:
        full_name:
          type: string
          maxLength: 150
        location:
          type: [string, "null"]
          maxLength: 150
        position:
          type: [string, "null"]
          maxLength: 100
        profession:
          type: [string, "null"]
          maxLength: 100
        phone_number:
          type: [string, "null"]
          maxLength: 30
        about:
          type: [string, "null"]
        projects_count:
          type: integer
          minimum: 0
        followers_count:
          type: integer
          minimum: 0
        experience_years:
          type: integer
          minimum: 0
        linkedin_url:
          type: [string, "null"]
          format: uri

    ExamResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Exam'
        meta:
          type: [object, "null"]

    Exam:
      type: object
      required: [id, course, exam_type, title, status, questions]
      properties:
        id:
          type: integer
        course:
          $ref: '#/components/schemas/Course'
        exam_type:
          type: string
          enum: [uts, uas, quiz]
        title:
          type: string
        room:
          type: [string, "null"]
        class_code:
          type: [string, "null"]
        exam_date:
          type: [string, "null"]
          format: date
        start_time:
          type: [string, "null"]
        duration_minutes:
          type: [integer, "null"]
        exam_kind:
          type: [string, "null"]
        learning_outcome:
          type: [string, "null"]
        instructions:
          type: [string, "null"]
        status:
          type: string
          enum: [draft, published, closed]
        questions:
          type: array
          items:
            $ref: '#/components/schemas/ExamQuestion'

    ExamQuestion:
      type: object
      required:
        - id
        - question_number
        - question_text
        - question_type
        - weight_percent
        - sort_order
      properties:
        id:
          type: integer
        question_number:
          type: integer
        question_text:
          type: string
        question_type:
          type: string
          enum: [essay, multiple_choice, file_upload]
        options_json:
          type: [object, array, "null"]
        weight_percent:
          type: number
          minimum: 0
          maximum: 100
        max_time_minutes:
          type: [integer, "null"]
        sort_order:
          type: integer

    AttemptResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/ExamAttempt'
        meta:
          type: [object, "null"]

    ExamAttempt:
      type: object
      required:
        - id
        - exam_id
        - user_id
        - attempt_number
        - status
        - started_at
      properties:
        id:
          type: integer
        exam_id:
          type: integer
        user_id:
          type: integer
        attempt_number:
          type: integer
        status:
          type: string
          enum: [in_progress, submitted, graded]
        score:
          type: [number, "null"]
        started_at:
          type: string
          format: date-time
        submitted_at:
          type: [string, "null"]
          format: date-time
        graded_at:
          type: [string, "null"]
          format: date-time

    AnswerUpdateRequest:
      type: object
      properties:
        answer_text:
          type: [string, "null"]
        selected_option:
          type: [string, "null"]
        file_url:
          type: [string, "null"]
          format: uri

    AnswerResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/ExamAnswer'
        meta:
          type: [object, "null"]

    ExamAnswer:
      type: object
      required: [id, attempt_id, question_id]
      properties:
        id:
          type: integer
        attempt_id:
          type: integer
        question_id:
          type: integer
        answer_text:
          type: [string, "null"]
        selected_option:
          type: [string, "null"]
        file_url:
          type: [string, "null"]
          format: uri
        score:
          type: [number, "null"]
        lecturer_feedback:
          type: [string, "null"]

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string

    ValidationErrorResponse:
      type: object
      required: [success, message, errors]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
